name: Automacao Mensal de Contas

on:
  schedule:
    # Executa todo dia 3 de cada mês às 09:00 UTC (06:00 no Brasil)
    - cron: '0 9 3 * *'
  workflow_dispatch:

jobs:
  processar_relatorio:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas Python
      run: |
        python -m pip install --upgrade pip
        pip install -r RelatorioContasMes/requirements.txt

    - name: Executar script de automacao
      env:
        WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        EMAIL_CONTAS: ${{ secrets.EMAIL_CONTAS }}
        EMAIL_CONTAS_SENHA: ${{ secrets.EMAIL_CONTAS_SENHA }}
      run: |
        cd RelatorioContasMes
        python script.py
