name: Automacao Mensal de Contas

on:
  schedule:
    # Executa TODO DIA às 09:00 UTC (06:00 no Brasil).
    # O script decide sozinho quando enviar (quando as faturas do mês chegarem)
    # e só envia uma vez por mês.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  processar_relatorio:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas Python
      run: |
        python -m pip install --upgrade pip
        pip install -r RelatorioContasMes/requirements.txt

    - name: Executar script de automacao
      env:
        WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
        CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        EMAIL_CONTAS: ${{ secrets.EMAIL_CONTAS }}
        EMAIL_CONTAS_SENHA: ${{ secrets.EMAIL_CONTAS_SENHA }}
      run: |
        cd RelatorioContasMes
        python script.py

    - name: Salvar estado de envio (pra não repetir no mesmo mês)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        git add RelatorioContasMes/estado_envio.json
        git diff --staged --quiet || git commit -m "chore: atualiza estado de envio [skip ci]"
        git push
